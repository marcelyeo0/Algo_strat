# FTMO 1-Step challenge.
# Source: https://ftmo.com/en/1-step-challenge/ (consulted 2026-10-28, values to be re-checked).
name: FTMO 1-Step
initial_capital: 100000
currency: USD

daily_loss:
  pct_of_initial: 0.03
  reference: max_balance_equity   # TODO: vérifier sur le site FTMO / FundedNext
  floating_counts: true

total_loss:
  type: trailing_eod              # trails the highest end-of-day balance
  pct_of_initial: 0.10
  trail_basis: balance            # TODO: vérifier sur le site FTMO / FundedNext
  lock_at_initial: true           # the floor stops trailing once it reaches the initial capital  # TODO: vérifier sur le site FTMO / FundedNext

phases:
  - name: phase1
    profit_target_pct: 0.10
    min_trading_days: 0           # TODO: vérifier sur le site FTMO / FundedNext
    max_calendar_days: null

# Best-day rule: the most profitable day must not exceed this share of the total profit.
best_day_rule_pct: 0.50           # TODO: vérifier sur le site FTMO / FundedNext

leverage:                         # TODO: vérifier sur le site FTMO / FundedNext
  fx: 30
  index: 15
  metal: 9
  energy: 5

allowed:
  overnight: true
  weekend: true                   # TODO: vérifier sur le site FTMO / FundedNext
  news: true
