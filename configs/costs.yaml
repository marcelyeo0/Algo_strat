# Trading costs per instrument (FTMO-like CFD conditions).
#
# spread:              typical full bid/ask spread in price units, used when the data has no
#                      observed spread.
# commission_per_lot:  account-currency commission per lot and per side (open or close).
# contract_size:       units of the underlying per lot.
# swap_long / swap_short: overnight financing in % of notional per year (negative = debit),
#                      charged on positions held over the server close; ACT/360.
# triple_swap_day:     weekday on which three nights are charged (0 = Monday ... 4 = Friday).
# stop_slippage_spreads: extra slippage on stop fills, in multiples of the spread.
#
# All values are conservative placeholders until they are reconciled with the FTMO MT5
# specifications (`uv run python -m common.data.mt5_export`, then common.costs.mt5_specs).
# The default swaps never credit positive carry. TODO: vérifier sur le site FTMO / FundedNext

defaults:
  spread_widening:
    enabled: true
    range_atr_threshold: 2.0   # day range above 2x the 20-day ATR counts as a high-volatility day
    factor: 2.0                # spread multiplier applied on such days
  stop_slippage_spreads: 0.5

instruments:
