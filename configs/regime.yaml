# Regime filter (common/regime). Output: exposure multiplier in [0, 1], never a direction.
features:
  vol_windows: [5, 21, 63]       # realised volatility windows (sessions)
  hmm_vol_window: 21             # volatility fed to the HMM together with the daily return
  return_lags: [1, 5, 21]        # lagged returns used by the classifiers

hmm:
  n_states: [2, 3, 4]            # candidate numbers of states, chosen by BIC on the train window
  covariance_type: full
  n_init: 3                      # random restarts per candidate, best log-likelihood kept
  n_iter: 200
  # How a state is mapped to an exposure score in [0, 1]:
  #   vol_rank    - calmest state = 1, most volatile = 0, linear in between
  #   sharpe_rank - ranked by the basket Sharpe ratio observed in each state on the train window
  state_score: vol_rank

smoothing:
  prob_halflife: 3               # causal EMA half-life (sessions) of the voted probabilities

ensemble:
  weights: {hmm: 1.0, random_forest: 1.0, lightgbm: 1.0}
  random_forest: {n_estimators: 300, max_depth: 6, min_samples_leaf: 20}
  lightgbm: {n_estimators: 300, learning_rate: 0.03, num_leaves: 15, min_child_samples: 30}

output:
  mode: continuous               # binary | continuous | hysteresis
  binary_threshold: 0.5
  continuous_floor: 0.0          # minimum multiplier in continuous mode
  hysteresis: {off_below: 0.35, on_above: 0.6}

walk_forward:
  train_years: 8
  test_months: 12
  expanding: true
