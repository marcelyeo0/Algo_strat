# Strategy 1: multi-asset time-series momentum with a Deep Momentum Network.
symbols: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD,
          EURGBP, EURJPY, GBPJPY, AUDJPY, EURCHF, AUDNZD, CADJPY,
          US500, US100, US30, US2000, GER40, EU50, FRA40, SPN35, N25, UK100, JP225, AUS200, HK50,
          XAUUSD, XAGUSD, COPPER, USOIL, UKOIL, NATGAS]

volatility:
  ewm_span: 60                 # ex-ante volatility estimator (EWMA span, sessions)
  asset_target: 0.15           # annualised target volatility of every asset position

features:
  return_horizons: [1, 21, 63, 126, 252]
  macd_pairs: [[8, 24], [16, 48], [32, 96]]
  mtdp:
    slow_weeks: 52
    fast_weeks: [4, 8, 20]     # Song & Jeon fast windows tested; one model per window
    fast_weeks_default: 8
  winsorise_sigma: 5.0         # daily returns capped at 5 EWMA standard deviations (Lim et al.)

baselines:
  tsmom_months: [1, 3, 12]

dmn:
  variant: lstm_mtdp           # lstm (Lim et al.) | lstm_mtdp (Song & Jeon)
  sequence_length: 63
  hidden_size: 20
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  max_grad_norm: 1.0
  max_epochs: 100
  patience: 15                 # early stopping on the chronological validation split
  validation_share: 0.10
  turnover_penalty: 1.0        # multiplier of the per-asset cost (bps from the cost profile); 0 = paper setting
  final_seeds: [11, 22, 33, 44, 55]   # final config averaged over 5 seeds (variance only)

walk_forward:
  train_years: 10
  test_months: 12
  expanding: true

portfolio:
  rebalance: weekly             # weights issued on the last session of each week (turnover audit)
  band: 0.02                    # no-trade band in weight units (tuned)
  weighting: inverse_vol        # each asset is already scaled to the same target volatility
  class_risk_caps: {fx: 0.40, index: 0.40, metal: 0.25, energy: 0.25}
  portfolio_target_vol: 0.08    # calibrated in Phase 6 against the prop daily-loss limit
  cov_window: 126

regime:
  basket: [EURUSD, GBPUSD, USDJPY, AUDUSD, US500, US100, GER40, UK100, JP225, XAUUSD, USOIL]
  mode: continuous

tuning:
  n_trials: 100                 # fixed in advance, every trial is logged
