# Cost profile "estimates": prudent placeholders until the FTMO MT5 export is available.
#
# spread:              typical full bid/ask spread in price units during normal hours, already
#                      marked up (roughly 1.5x the usual FTMO quotes) to stay on the prudent side.
# commission_per_lot:  account-currency commission per lot and per side (FTMO standard: USD 2.5
#                      per side on FX and metals, i.e. USD 5 per round turn; none on index and energy CFDs).
# contract_size:       units of the underlying per lot.
# swap_mode (time-varying model, policy rates from the BIS, see common/data/rates.py):
#   rates        - FX: long = (r_base - r_quote) - markup, short = (r_quote - r_base) - markup
#   index_rates  - cash indices: long = -(r + markup), short = r - markup, r = index currency rate
#   markup       - futures-based series (gold, silver, oil, copper, gas): carry already in the
#                  price, only the broker margin is charged (both sides)
#   (% of notional per year, ACT/360, negative = debit)
# swap_markup_by_class: broker margin above the policy-rate differential, % per year. To be
#   calibrated with the MT5 export (current FTMO swaps - current policy rates).
# swap_credit: zero = positive swaps are never credited (default) | real = credited (sensitivity).
# triple_swap_day:     weekday on which three nights are charged (0 = Monday ... 4 = Friday).
# stop_slippage_spreads: extra slippage on stop fills, in multiples of the spread.
#
# TODO: vérifier sur le site FTMO / FundedNext (toutes les valeurs de ce fichier)

profile: estimates

defaults:
  spread_widening:
    enabled: true
    range_atr_threshold: 2.0   # day range above 2x the 20-day ATR counts as a high-volatility day
    factor: 2.0                # spread multiplier applied on such days
  stop_slippage_spreads: 0.5
  close_execution_slippage_spreads: 0.5   # extra slippage of the "close t+1 + slippage" execution mode
  swap_credit: zero
  swap_markup_by_class:        # TODO: vérifier sur le site FTMO / FundedNext (calibrer par l'export MT5)
    fx: 1.5
    index: 2.5
    metal: 2.0
    energy: 2.0

