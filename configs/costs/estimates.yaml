# Cost profile "estimates": prudent placeholders until the FTMO MT5 export is available.
#
# spread:              typical full bid/ask spread in price units during normal hours, already
#                      marked up (roughly 1.5x the usual FTMO quotes) to stay on the prudent side.
# commission_per_lot:  account-currency commission per lot and per side (FTMO standard: USD 2.5
#                      per side on FX and metals, i.e. USD 5 per round turn; none on index and oil CFDs).
# contract_size:       units of the underlying per lot.
# swap_mode:
#   full     - FX and cash indices: the price series has no financing, the full CFD swap is
#              charged (swap_long / swap_short, % of notional per year, negative = debit).
#   markup   - futures-based series (gold, silver, oil): the futures price already contains the
#              cost of carry, so only the broker margin above carry is charged (swap_markup,
#              % per year, debit on both sides).
#   Positive swaps are never credited.
# triple_swap_day:     weekday on which three nights are charged (0 = Monday ... 4 = Friday).
# stop_slippage_spreads: extra slippage on stop fills, in multiples of the spread.
#
# TODO: vérifier sur le site FTMO / FundedNext (toutes les valeurs de ce fichier)

profile: estimates

defaults:
  spread_widening:
    enabled: true
    range_atr_threshold: 2.0   # day range above 2x the 20-day ATR counts as a high-volatility day
    factor: 2.0                # spread multiplier applied on such days
  stop_slippage_spreads: 0.5
  close_execution_slippage_spreads: 0.5   # extra slippage of the "close t + slippage" execution mode

instruments:
  EURUSD: {quote_ccy: USD, contract_size: 100000, spread: 0.00009, commission_per_lot: 2.5, swap_mode: full, swap_long: -2.0, swap_short: -2.0, triple_swap_day: 2}
