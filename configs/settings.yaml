# Global settings. This is the only place where the active cost profile is chosen; every
# command accepts `--cost-profile estimates|mt5` to override it.
#
# estimates : prudent placeholders (configs/costs/estimates.yaml, configs/propfirm/leverage/estimates.yaml)
# mt5       : values reconciled with the FTMO MT5 export (configs/costs/mt5.yaml, generated by
#             `uv run python -m common.costs.mt5_specs`)
cost_profile: estimates

# Profiles that are allowed to run the locked holdout.
holdout_allowed_cost_profiles: [mt5]
